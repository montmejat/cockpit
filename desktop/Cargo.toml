[package]
name = "cockpit-desktop"
version = "0.1.0"
edition = "2024"
description = "cockpit as a desktop app: a GTK 4 window around the local cockpit server"

[[bin]]
name = "cockpit"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
webkit6 = { version = "0.6", features = ["v2_42"] }
libc = "0.2"
serde_json = "1"

[profile.release]
strip = true
