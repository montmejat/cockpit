[package]
name = "cockpit-desktop"
version = "0.1.0"
edition = "2024"
description = "cockpit as a desktop app: a window around the local cockpit server"

[[bin]]
name = "cockpit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
libc = "0.2"
serde_json = "1"

[profile.release]
strip = true
